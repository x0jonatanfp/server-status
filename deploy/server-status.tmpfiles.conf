# Plantilla para systemd-tmpfiles: `make install` sustituye los marcadores @...@
# por el usuario y el grupo con los que corre el servicio.
#
# Crea el fichero de log del bot al arrancar la maquina.
#
# /var/log pertenece a root:syslog y el servicio corre con otro usuario, que no
# puede crear ficheros ahi. Esta linea lo garantiza con el dueno y los permisos
# correctos. Se instala en /etc/tmpfiles.d/server-status.conf
f /var/log/server-status.log 0640 @DEPLOY_USER@ @DEPLOY_GROUP@ -
